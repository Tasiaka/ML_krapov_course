services:
  app:
    build:
      context: ./app
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "${APP_PORT:-8000}"

  ml-worker:
    build:
      context: ./app
    working_dir: /app
    env_file:
      - .env
    environment:
      WORKER_ID: "worker-1"
      RABBITMQ_CONNECT_RETRIES: "60"
      RABBITMQ_CONNECT_SLEEP: "1.0"
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "src.worker"]

  ml-worker-2:
    build:
      context: ./app
    working_dir: /app
    env_file:
      - .env
    environment:
      WORKER_ID: "worker-2"
      RABBITMQ_CONNECT_RETRIES: "60"
      RABBITMQ_CONNECT_SLEEP: "1.0"
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "src.worker"]

  tests:
    build:
      context: ./app
    working_dir: /app
    env_file:
      - .env
    environment:
      BASE_URL: "http://web-proxy"
    volumes:
      - ./app:/app
    depends_on:
      web-proxy:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["pytest", "-q", "src/tests", "src/tests_e2e"]

  web-proxy:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_volume:
  rabbitmq_volume:

