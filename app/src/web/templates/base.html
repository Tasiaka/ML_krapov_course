<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "ML Service" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">ML Service</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            {% if user %}
              <li class="nav-item"><a class="nav-link" href="/cabinet">Кабинет</a></li>
              <li class="nav-item"><a class="nav-link" href="/history">История</a></li>
              {% if user.role == 'admin' %}
                <li class="nav-item"><a class="nav-link" href="/admin/users">Админ</a></li>
              {% endif %}
              <li class="nav-item"><a class="nav-link" href="/logout">Выйти</a></li>
            {% else %}
              <li class="nav-item"><a class="nav-link" href="/login">Войти</a></li>
              <li class="nav-item"><a class="nav-link" href="/register">Регистрация</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
