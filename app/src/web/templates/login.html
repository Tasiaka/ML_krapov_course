{% extends "base.html" %}
{% set title = "Вход" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <h2 class="mb-3">Вход</h2>

      {% if registered %}
        <div class="alert alert-success">Аккаунт создан. Теперь можно войти.</div>
      {% endif %}
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="card card-body">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input class="form-control" type="password" name="password" minlength="6" required />
        </div>
        <button class="btn btn-primary" type="submit">Войти</button>
      </form>
    </div>
  </div>
{% endblock %}
